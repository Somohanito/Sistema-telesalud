<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Telesalud</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--color-lightest);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--color-medium);
            opacity: 1;
            color: var(--color-lightest);
            border: 1px solid var(--color-light-sage);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .status-badge {
            background: rgba(218, 241, 222, 0.12);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--color-light-sage);
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Panel de Administración Global</h2>
        <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div class="container">
        <div class="admin-grid">
            
            <!-- Columna Izquierda: Alta de Usuarios -->
            <div>
                <div class="card">
                    <h3>Registrar Usuario del Sistema</h3>
                    <form id="userForm">
                        <div class="form-group">
                            <label>Nombre Completo:</label>
                            <input type="text" id="nombre" placeholder="Ej. Dr. Roberto Gómez" required>
                        </div>
                        <div class="form-group">
                            <label>Correo Electrónico:</label>
                            <input type="email" id="email" placeholder="usuario@hospital.com" required>
                        </div>
                        <div class="form-group">
                            <label>Contraseña Acceso:</label>
                            <input type="password" id="password" required>
                        </div>
                        <div class="form-group">
                            <label>Rol y Nivel de Acceso:</label>
                            <select id="rol">
                                <option value="ADMIN">ADMINISTRADOR DEL SISTEMA</option>
                                <option value="DIRECTOR">DIRECTOR GENERAL</option>
                                <option value="MEDICO">MÉDICO ATENDIENTE</option>
                                <option value="LABORATORIO">TÉCNICO DE LABORATORIO</option>
                            </select>
                        </div>
                        <button type="submit" class="btn" style="width: 100%;">Crear Registro de Usuario</button>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha: Gestión de Entidades (Usuarios, Expedientes y Solicitudes) -->
            <div>
                <div class="card">
                    <div class="tab-buttons">
                        <button class="tab-btn active" onclick="switchAdminTab(event, 'panel-usuarios')">Usuarios Registrados</button>
                        <button class="tab-btn" onclick="switchAdminTab(event, 'panel-expedientes')">Gestión Expedientes</button>
                        <button class="tab-btn" onclick="switchAdminTab(event, 'panel-solicitudes')">Gestión Solicitudes</button>
                    </div>

                    <!-- Pestaña Usuarios -->
                    <div id="panel-usuarios" class="tab-panel active">
                        <h3>Directorio de Usuarios Activos</h3>
                        <div style="overflow-x: auto;">
                            <table>
                                <thead>
                                    <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Acción</th></tr>
                                </thead>
                                <tbody id="usuariosTable"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pestaña Expedientes -->
                    <div id="panel-expedientes" class="tab-panel">
                        <h3>Expedientes Clínicos en Sistema</h3>
                        <div style="overflow-x: auto;">
                            <table>
                                <thead>
                                    <tr><th>ID</th><th>Paciente</th><th>Médico</th><th>Fecha</th><th>Acción</th></tr>
                                </thead>
                                <tbody id="expedientesTable"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pestaña Solicitudes Lab -->
                    <div id="panel-solicitudes" class="tab-panel">
                        <h3>Solicitudes de Laboratorio</h3>
                        <div style="overflow-x: auto;">
                            <table>
                                <thead>
                                    <tr><th>ID</th><th>Paciente</th><th>Estudio</th><th>Estado</th><th>Acción</th></tr>
                                </thead>
                                <tbody id="solicitudesTable"></tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function switchAdminTab(evt, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            evt.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        async function cargarUsuarios() {
            const res = await fetch('/api/admin/usuarios');
            const data = await res.json();
            document.getElementById('usuariosTable').innerHTML = data.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.nombre}</td>
                    <td>${u.email}</td>
                    <td><span class="status-badge">${u.rol}</span></td>
                    <td><button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="eliminarUsuario(${u.id})">Eliminar</button></td>
                </tr>
            `).join('');
        }

        async function cargarExpedientesAdmin() {
            const res = await fetch('/api/admin/expedientes-todos');
            const data = await res.json();
            document.getElementById('expedientesTable').innerHTML = data.map(e => `
                <tr>
                    <td>${e.id}</td>
                    <td>${e.paciente}</td>
                    <td>${e.medico}</td>
                    <td>${e.fecha_ingreso ? e.fecha_ingreso.split(' ')[0] : ''}</td>
                    <td><button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="eliminarExpediente(${e.id})">Eliminar</button></td>
                </tr>
            `).join('');
        }

        async function cargarSolicitudesAdmin() {
            const res = await fetch('/api/admin/solicitudes-todas');
            const data = await res.json();
            document.getElementById('solicitudesTable').innerHTML = data.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.paciente}</td>
                    <td>${s.tipo_estudio}</td>
                    <td><span class="status-badge">${s.estado}</span></td>
                    <td><button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="eliminarSolicitud(${s.id})">Eliminar</button></td>
                </tr>
            `).join('');
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value
            };
            await fetch('/api/admin/usuarios', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            document.getElementById('userForm').reset();
            cargarUsuarios();
        });

        async function eliminarUsuario(id) {
            if(confirm("¿Eliminar este usuario del sistema?")) {
                await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
                cargarUsuarios();
            }
        }

        async function eliminarExpediente(id) {
            if(confirm("¿Eliminar este registro clínico?")) {
                await fetch(`/api/admin/expedientes/${id}`, { method: 'DELETE' });
                cargarExpedientesAdmin();
            }
        }

        async function eliminarSolicitud(id) {
            if(confirm("¿Eliminar esta solicitud de laboratorio?")) {
                await fetch(`/api/admin/solicitudes/${id}`, { method: 'DELETE' });
                cargarSolicitudesAdmin();
            }
        }

        cargarUsuarios();
        cargarExpedientesAdmin();
        cargarSolicitudesAdmin();
    </script>
</body>
</html>
