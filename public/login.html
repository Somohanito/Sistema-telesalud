<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telesalud - Acceso al Sistema</title>
    <style>
        :root {
            --color-darkest: #021024;
            --color-dark: #052659;
            --color-medium: #5483B3;
            --color-light-sage: #7DA0CA;
            --color-lightest: #C1E8FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #083375, var(--color-darkest));
            overflow: hidden;
            position: relative;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        .bg-shape-1 {
            width: 320px;
            height: 320px;
            background: var(--color-medium);
            top: 10%;
            left: 20%;
        }

        .bg-shape-2 {
            width: 260px;
            height: 260px;
            background: var(--color-lightest);
            opacity: 0.2;
            bottom: 15%;
            right: 25%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: rgba(5, 38, 89, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(193, 232, 255, 0.25);
            border-radius: 24px;
            padding: 50px 30px 35px 30px;
            box-shadow: 0 20px 50px rgba(2, 16, 36, 0.7);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .avatar-badge {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background: var(--color-darkest);
            border: 2px solid var(--color-light-sage);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .avatar-badge svg {
            width: 44px;
            height: 44px;
            stroke: var(--color-lightest);
            fill: none;
            stroke-width: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            background: rgba(193, 232, 255, 0.9);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 0 3px var(--color-light-sage);
        }

        .input-icon {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(5, 38, 89, 0.1);
            border-right: 1px solid rgba(5, 38, 89, 0.15);
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--color-dark);
        }

        .input-group input {
            width: 100%;
            height: 48px;
            border: none;
            outline: none;
            background: transparent;
            padding: 0 14px;
            font-size: 14px;
            color: var(--color-darkest);
            font-weight: 500;
        }

        .input-group input::placeholder {
            color: #4a688a;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 12px;
            color: var(--color-lightest);
            opacity: 0.9;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--color-medium);
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--color-light-sage);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-pass:hover {
            color: var(--color-lightest);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--color-darkest);
            color: var(--color-lightest);
            border: 1px solid var(--color-medium);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 16, 36, 0.5);
        }

        .btn-submit:hover {
            background: var(--color-medium);
            border-color: var(--color-light-sage);
            box-shadow: 0 6px 18px rgba(84, 131, 179, 0.5);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        #errorMsg {
            color: #FFB4B4;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
            min-height: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="login-card">
        <div class="avatar-badge">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <form id="loginForm" style="margin-top: 15px;">
            <div class="input-group">
                <div class="input-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <input type="email" id="email" placeholder="Email ID" required autocomplete="email">
            </div>

            <div class="input-group">
                <div class="input-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass" onclick="alert('Consulte al Administrador del Sistema'); return false;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">LOGIN</button>
            <p id="errorMsg"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = '';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    const redirects = {
                        'ADMIN': 'admin.html',
                        'DIRECTOR': 'director.html',
                        'MEDICO': 'medico.html',
                        'LABORATORIO': 'laboratorio.html'
                    };
                    window.location.href = redirects[data.rol];
                } else {
                    errorMsg.innerText = data.error || 'Credenciales inválidas';
                }
            } catch (err) {
                errorMsg.innerText = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
